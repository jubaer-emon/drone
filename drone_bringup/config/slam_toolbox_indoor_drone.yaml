/**:
  ros__parameters:
    use_sim_time: true
    sync_mode: false

    # Frames
    odom_frame: odom
    map_frame: map
    base_frame: base_link
    laser_frame: laser

    # Topics
    scan_topic: /scan
    odom_topic: /odom

    mode: mapping

    # TF
    transform_timeout: 2.0
    tf_buffer_duration: 10.0
    transform_publish_period: 0.02

    # Scanner
    max_laser_range: 11.0
    minimum_laser_range: 0.15
    resolution: 0.05

    # Scan processing
    throttle_scans: 1
    scan_queue_size: 30

    # Scan matching
    use_scan_matching: true
    use_scan_barycenter: true

    # Loop closure
    do_loop_closing: true

    loop_search_maximum_distance: 4.0
    loop_match_minimum_chain_size: 5
    loop_match_maximum_variance_coarse: 3.0
    loop_match_minimum_response_coarse: 0.35

    # Drone motion thresholds
    minimum_travel_distance: 0.10
    minimum_travel_heading: 0.174

    # Search windows
    coarse_search_space_offset: 0.5
    coarse_angle_offset: 0.35
    fine_search_space_offset: 0.05
    fine_angle_offset: 0.035

    # Solver
    solver_plugin: solver_plugins::CeresSolver

    ceres_linear_solver: SPARSE_NORMAL_CHOLESKY
    ceres_preconditioner: SCHUR_JACOBI
    ceres_trust_strategy: LEVENBERG_MARQUARDT

    # Mapping
    map_update_interval: 1.0

    # Debug
    debug_logging: false